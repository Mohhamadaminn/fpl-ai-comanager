server {
    listen 80;
    server_name _;
    client_max_body_size 5m;

    root /usr/share/nginx/html;
    index index.html;

    # X-Forwarded-For is overwritten (not appended to) so a client cannot inject
    # its own values and dodge per-IP throttling. Django reads the last hop
    # (REST_FRAMEWORK NUM_PROXIES=1). If another proxy/CDN is placed in front of
    # this nginx, configure real_ip_header/set_real_ip_from here first, otherwise
    # every visitor will share the proxy's IP.
    # Slightly above the slowest expected LLM-backed request (see GROQ_* in settings),
    # so users get a clean 504 instead of a hung connection.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_connect_timeout 5s;
        proxy_read_timeout 95s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}